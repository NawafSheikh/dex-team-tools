<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightwater Expenses</title>
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/expenses" aria-label="Brightwater Expenses home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5c1.5 0 2.25-1.5 4.5-1.5S10.5 9.5 12 9.5 14.25 8 16.5 8 19.5 9.5 21 9.5"/><path d="M3 15.5c1.5 0 2.25-1.5 4.5-1.5s3 1.5 4.5 1.5 2.25-1.5 4.5-1.5 3 1.5 4.5 1.5"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Brightwater Expenses</span>
          <span class="brand-sub">Brightwater Logistics</span>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="payrun">
          <div class="payrun-label">Next payment run</div>
          <div class="payrun-value" id="payrun-date">Friday</div>
          <div class="payrun-note">Approved expenses are paid to your bank account every Friday.</div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="user" aria-label="Signed in user">
          <span class="avatar" aria-hidden="true">MP</span>
          <span class="user-text">
            <span class="user-name">Maya Patel</span>
            <span class="user-role">Operations</span>
          </span>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/views-expenses.js"></script>
  <script src="assets/js/views-form.js"></script>
  <script src="assets/js/views-pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
